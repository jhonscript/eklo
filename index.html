<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éklo · Outils d'atelier</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1716);--ink:light-dark(#10211f,#e6f2f0);--mut:light-dark(#4f6a66,#9db8b3);--pan:light-dark(#eff7f6,#14221f);--line:light-dark(#d3e6e2,#26403b);--teal:light-dark(#0c8a84,#3cc4bb)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding:40px 16px}
main{max-width:640px;margin:0 auto}
h1{font:700 32px Fredoka,sans-serif;color:var(--teal);margin:0 0 6px}
p{color:var(--mut);margin:0 0 24px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--pan);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
a.card b{font:700 19px Fredoka,sans-serif;color:var(--teal)}
a.card span{display:block;color:var(--mut);font-size:14.5px;margin-top:2px}
.soon{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<main>
<h1>Éklo · Outils d'atelier</h1>
<p>Générateurs de pièces personnalisées, à la mesure exacte, prêts pour Bambu Studio.</p>
<a class="card" href="lettres-gonflees/"><b>Lettres gonflées</b><span>Chaque lettre à la hauteur exacte, gonflée, vérifiée, en 3MF ou STL.</span></a>
<a class="card soon" aria-disabled="true"><b>Ornement de Noël avec prénoms</b><span>Bientôt.</span></a>
</main>
</body>
</html>
