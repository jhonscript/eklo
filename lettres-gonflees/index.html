<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éklo · Atelier lettres gonflées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Coiny&family=Cherry+Bomb+One&family=DynaPuff:wght@700&family=Bagel+Fat+One&family=Gluten:wght@900&family=Fredoka:wght@700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1716);--ink:light-dark(#10211f,#e6f2f0);--mut:light-dark(#4f6a66,#9db8b3);--pan:light-dark(#eff7f6,#14221f);--line:light-dark(#d3e6e2,#26403b);--teal:light-dark(#0c8a84,#3cc4bb);--ok:light-dark(#11804a,#4fd38c);--warn:light-dark(#b4560b,#f3a450)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Figtree,system-ui,sans-serif}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font:700 22px Fredoka,Figtree,sans-serif;color:var(--teal)}
header span{color:var(--mut);font-size:14px;flex:1}
.lang{display:flex;gap:4px}
.lang button{font:700 13px Figtree,sans-serif;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
main{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 60px)}
aside{padding:18px 20px;background:var(--pan);border-right:1px solid var(--line)}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
label small{font-weight:400;color:var(--mut)}
input[type=text],input[type=number],select{width:100%;font:16px Figtree,sans-serif;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--teal)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:600 14px Figtree,sans-serif;padding:6px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--teal)}
.lt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.lt button{min-width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px Fredoka,sans-serif;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0 7px}
.lt button i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px #0003}
.lt button[aria-pressed=true]{border-color:var(--teal);box-shadow:0 0 0 1.5px var(--teal) inset}
.lt .all{font:600 13px Figtree,sans-serif}
.box{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.box label{margin-top:0}
.btn{font:700 15px Figtree,sans-serif;width:100%;margin-top:18px;padding:12px;border-radius:12px;border:0;background:var(--teal);color:#fff;cursor:pointer}
.btn.sm{width:auto;margin-top:8px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--mut);margin:8px 0 0}
section{display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:380px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--teal) 10%,var(--bg)),var(--bg) 70%)}
#view canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
#busy{position:absolute;top:12px;left:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
#status{padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.p-w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tbl{overflow-x:auto;padding:0 20px 18px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:13px}
td a{color:var(--teal);font-weight:600;cursor:pointer}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px var(--line)}
#prod{margin:0 20px 20px;padding:12px 14px;border-radius:12px;background:var(--pan);border:1px solid var(--line);font-size:14px}
#prod:empty{display:none}
#prod b{font-family:Fredoka,sans-serif}
#prod ol{list-style:none;margin:10px 0 6px;padding:0}
#prod li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
#prod li.done{opacity:.5}
#prod li.done .ch{text-decoration:line-through}
#prod li input{width:20px;height:20px;accent-color:var(--teal);margin:0}
#prod li .n{color:var(--mut);font-size:13px;min-width:2.6em}
#prod li .ch{font:700 20px Fredoka,sans-serif;min-width:1.2em}
#prod li .g{color:var(--mut);margin-left:auto}
#prod li a,td a{color:var(--teal);font-weight:700;cursor:pointer}
#prod .sp{color:var(--mut);font-size:13.5px}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}aside{border-right:0;border-bottom:1px solid var(--line)}#view{min-height:320px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header><h1 data-t="title"></h1><span data-t="sub"></span><div class="lang" id="lang"></div></header>
<main>
<aside>
  <div class="box">
    <label for="link"><span data-t="orderLbl"></span> <small data-t="orderHint"></small></label>
    <input type="text" id="link" placeholder="https://…/configurateur/?t=LEA&h=150…" autocomplete="off">
    <button class="btn sm" id="load" type="button" data-t="load"></button>
    <div class="note" id="linkmsg"></div>
  </div>
  <label for="txt"><span data-t="letters"></span> <small data-t="lettersHint"></small></label>
  <input type="text" id="txt" maxlength="15" autocomplete="off" spellcheck="false">
  <label for="font" data-t="font"></label>
  <select id="font"></select>
  <label for="h"><span data-t="height"></span> <small>(mm)</small></label>
  <input type="number" id="h" min="30" max="256" step="0.5">
  <div class="row" id="hp"></div>
  <label for="puff" id="puffv"></label>
  <input type="range" id="puff" min="12" max="40" step="1">
  <label for="round" id="roundv"></label>
  <input type="range" id="round" min="50" max="90" step="5">
  <label for="fat" id="fatv"></label>
  <input type="range" id="fat" min="0" max="16" step="1">
  <label for="wide" id="widev"></label>
  <input type="range" id="wide" min="70" max="110" step="1">
  <label for="smooth" id="smoothv"></label>
  <input type="range" id="smooth" min="0" max="12" step="1">
  <button class="btn sm" id="reset" type="button" data-t="reset"></button>
  <label><span data-t="colours"></span> <small data-t="coloursHint"></small></label>
  <div class="lt" id="lt"></div>
  <div class="sw" id="col"></div>
  <label data-t="finish"></label>
  <div class="row" id="tex"></div>
  <label data-t="quality"></label>
  <div class="row" id="q"></div>
  <button class="btn" id="dl3mf" disabled></button>
  <p class="note" data-t="note"></p>
</aside>
<section>
  <div id="view"><div id="busy" hidden data-t="busy"></div></div>
  <div id="status"></div>
  <div class="tbl"><table><thead><tr><th data-t="thLetter"></th><th data-t="thWidth"></th><th data-t="thHeight"></th><th data-t="thThick"></th><th data-t="thFil"></th><th data-t="thCheck"></th><th data-t="thColour"></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="prod"></div>
</section>
</main>

<script type="module">

const T = {
  fr: {
    title:'Éklo · Atelier lettres gonflées', sub:'Hauteur exacte, vérifiée, prête pour Bambu Studio',
    orderLbl:"Commande d'un client", orderHint:'(coller le lien du configurateur)', load:'Charger la commande',
    loaded:'Chargée', badLink:'<span class="pill p-w">Lien non reconnu</span> Collez le lien complet copié depuis le configurateur.',
    letters:'Lettres', lettersHint:'(chaque lettre = une pièce)', font:'Police', height:'Hauteur exacte de chaque lettre',
    puff:(p,mm)=>`Gonflement : ${p} % de la hauteur (≈ ${mm} mm)`, fat:f=>f?`Rondeur : +${f} %`:'Rondeur : police d’origine',

    dl:n=>`Télécharger les ${n} lettres (.zip, un 3MF par lettre)`, preparing:'Préparation des fichiers…',
    note:'Chaque lettre a son propre 3MF, centrée sur le plateau, dos plat en bas, nommée avec sa couleur : comme vous imprimez, une lettre à la fois. Les grammes affichés sont une estimation : le chiffre exact sort au tranchage.',
    queue:'File d’impression', printed:(d,n)=>`${d}/${n} imprimée(s)`, spools:'Bobines à prévoir', markDone:'Marquer comme imprimée',
    busy:'Génération…', thLetter:'Lettre', thWidth:'Largeur', thHeight:'Hauteur', thThick:'Épaisseur', thFil:'Filament ~', thCheck:'Contrôle', thColour:'Couleur · fichier',
    ok:'Mesure ✓ · 1 pièce ✓', body:'corps', okMulti:n=>`Mesure ✓ · ${n} pièces (accent à coller)`, check:'À vérifier', valid:'Validé', ignored:'Ignoré', empty:'Écrivez au moins une lettre.',
    iHeight:(g,w)=>`hauteur ${g} mm ≠ ${w} mm`, iBed:'dépasse le plateau 256 mm', iPieces:n=>`${n} morceaux séparés`, iHoles:(g,w)=>`${g} trou(s) au lieu de ${w}`, iMesh:n=>`maillage : ${n} arête(s) à réparer (Bambu Studio le fait seul)`,
    status:(n,h,tol)=>`${n} pièce(s), chacune mesurée à ${h} mm de haut (± ${tol} mm), toutes tiennent sur le plateau.`, total:g=>`Filament total ~${g} g.`,
    prod:'Fiche de production', prodLetters:(n,cm)=>`${n} lettre(s) de ${cm} cm`, texOn:'Finition <b>texturée</b> : activer « Fuzzy skin » sur toutes les pièces', texOff:'Finition lisse',
  },
  en: {
    title:'Éklo · Puffy letters workshop', sub:'Exact height, verified, ready for Bambu Studio',
    orderLbl:'Customer order', orderHint:'(paste the configurator link)', load:'Load order',
    loaded:'Loaded', badLink:'<span class="pill p-w">Link not recognised</span> Paste the full link copied from the configurator.',
    letters:'Letters', lettersHint:'(each letter = one part)', font:'Font', height:'Exact height of each letter',
    puff:(p,mm)=>`Puffiness: ${p}% of height (≈ ${mm} mm)`, fat:f=>f?`Roundness: +${f}%`:'Roundness: original font',
    round:r=>`Top (last layer): ${r<=0.5?'flat':r<0.8?'rounded':'very rounded'} (${Math.round(r*100)})`,
    wide:w=>`Width: ${w}%`, smooth:s=>s?`Smoothing: ${s}%`:'Smoothing: none', reset:'Back to Éklo style',
    colours:'Colours', coloursHint:'(pick a letter, then the colour)', all:'All', finish:'Finish', quality:'Mesh quality', std:'Standard', fine:'Fine',
    dl:n=>`Download all ${n} letters (.zip, one 3MF per letter)`, preparing:'Preparing files…',
    note:'Each letter gets its own 3MF, centred on the plate, flat back down, named with its colour: the way you print, one letter at a time. Grams shown are an estimate: the exact figure comes from slicing.',
    queue:'Print queue', printed:(d,n)=>`${d}/${n} printed`, spools:'Spools needed', markDone:'Mark as printed',
    busy:'Generating…', thLetter:'Letter', thWidth:'Width', thHeight:'Height', thThick:'Thickness', thFil:'Filament ~', thCheck:'Check', thColour:'Colour · file',
    ok:'Size ✓ · 1 part ✓', body:'body', okMulti:n=>`Size ✓ · ${n} parts (accent to glue)`, check:'Check', valid:'Validated', ignored:'Skipped', empty:'Type at least one letter.',
    iHeight:(g,w)=>`height ${g} mm ≠ ${w} mm`, iBed:'larger than the 256 mm plate', iPieces:n=>`${n} separate pieces`, iHoles:(g,w)=>`${g} hole(s) instead of ${w}`, iMesh:n=>`mesh: ${n} edge(s) to repair (Bambu Studio does it automatically)`,
    status:(n,h,tol)=>`${n} part(s), each measured at ${h} mm tall (± ${tol} mm), all fit on the plate.`, total:g=>`Total filament ~${g} g.`,
    prod:'Production sheet', prodLetters:(n,cm)=>`${n} letter(s) at ${cm} cm`, texOn:'<b>Textured</b> finish: turn on “Fuzzy skin” for all parts', texOff:'Smooth finish',
  },
  es: {
    title:'Éklo · Taller de letras infladas', sub:'Altura exacta, verificada, lista para Bambu Studio',
    orderLbl:'Pedido de un cliente', orderHint:'(pega el enlace del configurador)', load:'Cargar el pedido',
    loaded:'Cargado', badLink:'<span class="pill p-w">Enlace no reconocido</span> Pega el enlace completo copiado del configurador.',
    letters:'Letras', lettersHint:'(cada letra = una pieza)', font:'Tipografía', height:'Altura exacta de cada letra',
    puff:(p,mm)=>`Inflado: ${p} % de la altura (≈ ${mm} mm)`, fat:f=>f?`Redondez: +${f} %`:'Redondez: tipografía original',
    round:r=>`Tapa (última capa): ${r<=0.5?'plana':r<0.8?'redondeada':'muy redondeada'} (${Math.round(r*100)})`,
    wide:w=>`Ancho: ${w} %`, smooth:s=>s?`Suavizado: ${s} %`:'Suavizado: ninguno', reset:'Volver al estilo Éklo',
    colours:'Colores', coloursHint:'(elige una letra y luego el color)', all:'Todas', finish:'Acabado', quality:'Calidad de la malla', std:'Estándar', fine:'Fina',
    dl:n=>`Descargar las ${n} letras (.zip, un 3MF por letra)`, preparing:'Preparando los archivos…',
    note:'Cada letra tiene su propio 3MF, centrada en la cama, con el dorso plano abajo y nombrada con su color: como imprimes, una letra a la vez. Los gramos son un estimado: el dato exacto sale al rebanar.',
    queue:'Cola de impresión', printed:(d,n)=>`${d}/${n} impresas`, spools:'Bobinas necesarias', markDone:'Marcar como impresa',
    busy:'Generando…', thLetter:'Letra', thWidth:'Ancho', thHeight:'Alto', thThick:'Espesor', thFil:'Filamento ~', thCheck:'Control', thColour:'Color · archivo',
    ok:'Medida ✓ · 1 pieza ✓', body:'cuerpo', okMulti:n=>`Medida ✓ · ${n} piezas (acento para pegar)`, check:'Revisar', valid:'Validado', ignored:'Omitido', empty:'Escribe al menos una letra.',
    iHeight:(g,w)=>`altura ${g} mm ≠ ${w} mm`, iBed:'no cabe en la cama de 256 mm', iPieces:n=>`${n} piezas separadas`, iHoles:(g,w)=>`${g} hueco(s) en vez de ${w}`, iMesh:n=>`malla: ${n} arista(s) por reparar (Bambu Studio lo hace solo)`,
    status:(n,h,tol)=>`${n} pieza(s), cada una medida a ${h} mm de alto (± ${tol} mm), todas caben en la cama.`, total:g=>`Filamento total ~${g} g.`,
    prod:'Hoja de producción', prodLetters:(n,cm)=>`${n} letra(s) de ${cm} cm`, texOn:'Acabado <b>texturizado</b>: activar “Fuzzy skin” en todas las piezas', texOff:'Acabado liso',
  },
};

const $ = id => document.getElementById(id);
const FONTS = [
  // Les 5 polices « ballon » gratuites (licence OFL, usage commercial permis) entre lesquelles Éklo choisit
  {id:'eklo',    label:'Éklo Bulle Ronde (original)', ...EKLO_BULLE_RONDE},
  {id:'eklo-gon',label:'Éklo Bulle Gonflée (original)', ...EKLO_BULLE_GONFLEE},
  {id:'eklo-fin',label:'Éklo Bulle (original, plus fine)', ...EKLO_BULLE},
  {id:'cherry',  label:'Cherry Bomb One', f:'Cherry Bomb One', w:400, fat:4},
  {id:'coiny',   label:'Coiny', f:'Coiny', w:400, fat:4},
  {id:'dynapuff',label:'DynaPuff', f:'DynaPuff', w:700, fat:4},
  {id:'bagel',   label:'Bagel Fat One', f:'Bagel Fat One', w:400, fat:4},
  {id:'gluten',  label:'Gluten', f:'Gluten', w:900, fat:4},
];
let lang = detectLang(), t = T[lang];
const STYLE = () => ({ font:'eklo', puff:CATALOGUE.puff, fat:CATALOGUE.fat, wide:CATALOGUE.wide, smooth:CATALOGUE.smooth, profile:CATALOGUE.profile, round:CATALOGUE.round, swell:CATALOGUE.swell||0 });
const S = { text:'EKLO', h:150, q:'std', colors:[], tex:'lisse', ...STYLE() };
fitColors(S);
let sel = 'all';
const fmt = (n,d=1) => n.toLocaleString(locale(lang), { minimumFractionDigits:d, maximumFractionDigits:d });

$('font').innerHTML = FONTS.map(f=>`<option value="${f.id}">${f.label}</option>`).join('');
function chips(el, opts, get, set){
  const draw = () => el.innerHTML = opts().map(o=>`<button type="button" class="chip" data-v="${o[0]}" aria-pressed="${String(o[0])===String(get())}">${o[1]}</button>`).join('');
  draw(); el.onclick = e => { const b=e.target.closest('button'); if(!b) return; set(b.dataset.v); draw(); };
  return draw;
}
const drawHp = chips($('hp'), ()=>CATALOGUE.sizes.map(s=>[s.h, `${fmt(s.h/10,0)} cm`]), ()=>S.h, v=>{ S.h=+v; $('h').value=v; labels(); schedule(); });
const drawTex = chips($('tex'), ()=>CATALOGUE.textures.map(x=>[x.id, x[lang]]), ()=>S.tex, v=>{ S.tex=v; paint(); renderProd(); });
const drawQ = chips($('q'), ()=>[['std',t.std],['fine',t.fine]], ()=>S.q, v=>{ S.q=v; schedule(); });
function drawColors(){
  const chars = lettersOf(S.text);
  if (sel !== 'all' && sel >= chars.length) sel = 'all';
  $('lt').innerHTML = `<button type="button" class="all" data-i="all" aria-pressed="${sel==='all'}">${t.all}</button>` + chars.map((c,i)=>`<button type="button" data-i="${i}" aria-pressed="${sel===i}">${c}<i style="background:${colorById(S.colors[i]).hex}"></i></button>`).join('');
  const cur = sel==='all' ? (S.colors.every(c=>c===S.colors[0]) ? S.colors[0] : null) : S.colors[sel];
  $('col').innerHTML = CATALOGUE.colors.map(c=>`<button type="button" title="${c[lang]}" aria-label="${c[lang]}" style="background:${c.hex}" aria-pressed="${c.id===cur}" data-c="${c.id}"></button>`).join('');
}
$('lt').onclick = e => { const b=e.target.closest('button'); if(!b) return; sel = b.dataset.i==='all' ? 'all' : +b.dataset.i; drawColors(); };
$('col').onclick = e => { const b=e.target.closest('button'); if(!b) return; if (sel==='all') S.colors = S.colors.map(()=>b.dataset.c); else S.colors[sel] = b.dataset.c; drawColors(); paint(); renderTable(); renderProd(); };
const labels = () => { $('puffv').textContent = t.puff(S.puff, fmt(S.h*S.puff/100,0)); $('fatv').textContent = t.fat(S.fat); $('widev').textContent = t.wide(S.wide); $('smoothv').textContent = t.smooth(S.smooth); $('roundv').textContent = t.round(S.round || 0.5); };
function syncInputs(){ $('txt').value=S.text; $('h').value=S.h; $('puff').value=S.puff; $('fat').value=S.fat; $('wide').value=S.wide; $('smooth').value=S.smooth; $('round').value=Math.round((S.round||0.5)*100); $('font').value=S.font; drawHp(); drawTex(); drawQ(); drawColors(); labels(); }
$('wide').oninput = e => { S.wide=+e.target.value; labels(); schedule(); };
$('smooth').oninput = e => { S.smooth=+e.target.value; labels(); schedule(); };
$('round').oninput = e => { S.round=+e.target.value/100; labels(); schedule(); };
$('reset').onclick = () => { Object.assign(S, STYLE()); syncInputs(); schedule(); };
$('txt').oninput = e => { S.text = e.target.value.toUpperCase(); fitColors(S); drawColors(); schedule(); };
// chaque police a sa « rondeur » conseillée (Éklo Bulle : 0, le trait donne déjà la graisse)
// chaque police apporte ses réglages conseillés (alphabets Éklo : font.style ; polices Google : rondeur 4 %)
$('font').onchange = e => { S.font = e.target.value; const f = FONTS.find(x=>x.id===S.font); Object.assign(S, { swell:0 }, f.style || { puff:25, fat:f.fat ?? 4, wide:100, smooth:0, profile:'circle', round:0.5 }); syncInputs(); schedule(); };
$('h').oninput = e => { const v=+e.target.value; if(v>0){ S.h=v; drawHp(); labels(); schedule(); } };
$('puff').oninput = e => { S.puff=+e.target.value; labels(); schedule(); };
$('fat').oninput = e => { S.fat=+e.target.value; labels(); schedule(); };
let loadedMsg = null;
function drawLinkMsg(){ $('linkmsg').innerHTML = loadedMsg === 'bad' ? t.badLink : loadedMsg ? `<span class="pill p-ok">${t.loaded}</span> ${loadedMsg.text} · ${fmt(loadedMsg.h/10,0)} cm · ${CATALOGUE.textures.find(x=>x.id===loadedMsg.tex)[lang]}` : ''; }
$('load').onclick = () => {
  try {
    const u = new URL($('link').value.trim());
    if (!u.searchParams.get('t')) throw 0;
    const o = parseOrder(u.search);
    Object.assign(S, { text:o.text, h:o.h, colors:o.colors, tex:o.tex, ...STYLE() });
    sel = 'all'; syncInputs(); schedule(); loadedMsg = o;
  } catch { loadedMsg = 'bad'; }
  drawLinkMsg();
};

const viewer = createViewer($('view'));
let LET = [], IDX = [], BAD = [], timer = 0, run = 0;
function schedule(){ clearTimeout(timer); timer = setTimeout(build, 250); }
// IDX[k] = position dans lettersOf(S.text) de la k-ième pièce générée (pour retrouver sa couleur)
async function build(){
  const my = ++run, font = FONTS.find(f=>f.id===S.font), all = lettersOf(S.text);
  IDX = all.map((c,i)=>isAllowed(c)?i:-1).filter(i=>i>=0);
  BAD = all.filter(c=>!isAllowed(c));
  $('busy').hidden = false; $('dl3mf').disabled = true;
  const L = await buildLetters(IDX.map(i=>all[i]), font, { h:S.h, puff:S.puff, fat:S.fat, wide:S.wide, smooth:S.smooth, profile:S.profile, round:S.round, swell:S.swell, q:S.q }, () => my !== run);
  if (!L) return;
  // la file d'impression repart de zéro si les lettres ou la hauteur changent
  const qk = L.map(l=>l.ch).join('') + '|' + S.h;
  if (qk !== window.__qk) { DONE = new Set(); window.__qk = qk; }
  LET = L; paint(); renderTable(); renderProd(); renderStatus(); dlLabel();
  $('busy').hidden = true;
  // bloquent le téléchargement : hauteur, plateau, trous. Pièces multiples (accent à coller) et petites réparations de maillage : avertissement seulement
  $('dl3mf').disabled = !LET.length || LET.some(l=>l.issues.some(x=>x.code==='height'||x.code==='bed'||x.code==='holes'));
}
const issueTxt = l => l.issues.map(x => x.code==='height' ? t.iHeight(fmt(x.got), fmt(S.h)) : x.code==='bed' ? t.iBed : x.code==='holes' ? t.iHoles(x.got, x.want) : x.code==='mesh' ? t.iMesh(x.n) : t.iPieces(x.n));
function renderStatus(){
  const withIssues = LET.filter(l=>l.issues.length), total = LET.reduce((s,l)=>s+l.grams,0);
  $('status').innerHTML = !LET.length ? t.empty :
    (withIssues.length ? `<span class="pill p-w">${t.check}</span> ${withIssues.map(l=>`${l.ch} : ${issueTxt(l).join(', ')}`).join(' · ')}` :
    `<span class="pill p-ok">${t.valid}</span> ${t.status(LET.length, fmt(S.h), fmt(TOL))}`) +
    ` &nbsp;${t.total(Math.round(total))}` + (BAD.length?` <span class="pill p-w">${t.ignored}</span> ${BAD.join(' ')}`:'');
}
const colorOf = k => colorById(S.colors[IDX[k]]);
function paint(){ viewer.show(LET, LET.map((_,k)=>colorOf(k).hex), { textured: S.tex==='texture', spaceBefore: spacesBefore(S.text) }); }
function renderTable(){
  $('rows').innerHTML = LET.map((l,k)=>`<tr><td><b>${l.ch}</b></td><td>${fmt(l.w)} mm</td><td><b>${fmt(l.h)} mm</b>${l.body && Math.abs(l.body-l.h)>0.5 ? ` <span class="note">(${t.body} ${fmt(l.body)})</span>` : ''}</td><td>${fmt(l.t)} mm</td><td>${Math.round(l.grams)} g</td><td>${l.issues.length?`<span class="pill p-w">${t.check}</span>`:`<span class="pill p-ok">${l.pieces>1 ? t.okMulti(l.pieces) : t.ok}</span>`}</td><td><span class="dot" style="background:${colorOf(k).hex}"></span>${colorOf(k)[lang]} · <a data-k="${k}" data-f="3mf">3MF</a> · <a data-k="${k}" data-f="stl">STL</a></td></tr>`).join('');
}
// File d'impression : une lettre = un travail sur la P2S, dans l'ordre du prénom, avec case « imprimée »
let DONE = new Set();
function renderProd(){
  if (!LET.length) { $('prod').innerHTML=''; return; }
  const by = new Map();
  LET.forEach((l,k)=>{ const c=colorOf(k); if(!by.has(c.id)) by.set(c.id,{c,letters:[],g:0}); const e=by.get(c.id); e.letters.push(l.ch); e.g+=l.grams; });
  const n = LET.length;
  $('prod').innerHTML = `<b>${t.queue}</b> · ${t.prodLetters(n, fmt(S.h/10))} · ${S.tex==='texture' ? t.texOn : t.texOff} · <span class="pill ${DONE.size===n?'p-ok':'p-w'}">${t.printed(DONE.size, n)}</span>
    <ol>${LET.map((l,k)=>`<li class="${DONE.has(k)?'done':''}"><input type="checkbox" data-done="${k}" ${DONE.has(k)?'checked':''} aria-label="${t.markDone} ${l.ch}"><span class="n">${k+1}/${n}</span><span class="ch">${l.ch}</span><span><span class="dot" style="background:${colorOf(k).hex}"></span>${colorOf(k)[lang]}</span><span class="g">~${Math.round(l.grams)} g</span><a data-k="${k}" data-f="3mf">3MF</a></li>`).join('')}</ol>
    <div class="sp">${t.spools} : ${[...by.values()].map(e=>`<span class="dot" style="background:${e.c.hex}"></span>${e.c[lang]} (${e.letters.join(' ')}, ~${Math.round(e.g)} g)`).join(' &nbsp;·&nbsp; ')}</div>`;
}
const baseName = () => `eklo_${S.text.replace(/[^A-Za-z0-9À-ÿ]/g,'')||'lettres'}_${S.h/10}cm`;
const texName = () => S.tex==='texture' ? ' ' + CATALOGUE.textures.find(x=>x.id==='texture')[lang] : '';
const fileName = (k, ext) => `${baseName()}_${k+1}-${LET.length}_${LET[k].ch}_${colorOf(k).id}.${ext}`;
const letterMF = k => threeMF([LET[k]], [`${LET[k].ch} ${fmt(S.h/10)}cm ${colorOf(k)[lang]}${texName()}`], { center:true });
async function onFile(e){
  const a = e.target.closest('a[data-k]'); if (!a) return;
  const k = +a.dataset.k;
  if (a.dataset.f === 'stl') save(stl(LET[k]), fileName(k,'stl')); else save(await letterMF(k), fileName(k,'3mf'));
}
$('rows').onclick = onFile;
$('prod').onclick = onFile;
$('prod').onchange = e => { const c = e.target.closest('input[data-done]'); if (!c) return; const k = +c.dataset.done; c.checked ? DONE.add(k) : DONE.delete(k); renderProd(); };
const dlLabel = () => { $('dl3mf').textContent = t.dl(LET.length || 0); };
$('dl3mf').onclick = async () => {
  const b=$('dl3mf'); b.disabled=true; b.textContent=t.preparing;
  try {
    const files = [];
    for (let k = 0; k < LET.length; k++) files.push([fileName(k,'3mf'), new Uint8Array(await (await letterMF(k)).arrayBuffer())]);
    save(await zip(files), baseName()+'.zip');
  } finally { b.disabled=false; dlLabel(); }
};

function texts(){ t = T[lang]; applyTexts(t, lang); document.title = t.title; drawHp(); drawTex(); drawQ(); drawColors(); labels(); drawLinkMsg(); dlLabel(); if (LET.length) { renderTable(); renderProd(); renderStatus(); } }
langSwitcher($('lang'), lang, l => { lang = l; texts(); });
texts(); syncInputs(); build();
window.__eklo = { get letters(){ return LET; }, S };
</script>
</body>
</html>
